# MedNear Production Nginx Configuration
# Reverse Proxy with HTTPS / SSL, HTTP/2, Gzip, and Security Headers

worker_processes auto;
daemon off;

error_log /Users/leela/.gemini/antigravity/scratch/mednear/logs/nginx_error.log warn;
pid       /Users/leela/.gemini/antigravity/scratch/mednear/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /opt/miniconda3/etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  production  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'rt=$request_time ut=$upstream_response_time';

    access_log  /Users/leela/.gemini/antigravity/scratch/mednear/logs/nginx_access.log  production;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Gunicorn WSGI Cluster
    upstream gunicorn_backend {
        server 127.0.0.1:8000 fail_timeout=0;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server (Port 3000 & 8080) -> Direct Fast Serving (No SSL Warning)
    # --------------------------------------------------------------------------
    server {
        listen 3000;
        listen 8080;
        server_name _ localhost 127.0.0.1 192.168.1.52;

        root /Users/leela/.gemini/antigravity/scratch/mednear;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        location = / {
            try_files /index.html =404;
        }

        location /api/ {
            proxy_pass http://gunicorn_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS / SSL Server (Port 8443) -> Reverse Proxy to Gunicorn
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name _ localhost 127.0.0.1 192.168.1.52;

        # SSL / TLS Certificate Configuration
        ssl_certificate     /Users/leela/.gemini/antigravity/scratch/mednear/ssl/mednear.crt;
        ssl_certificate_key /Users/leela/.gemini/antigravity/scratch/mednear/ssl/mednear.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Assets Served Directly by Nginx for Blazing Performance
        root /Users/leela/.gemini/antigravity/scratch/mednear;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Single-Page Frontend Application
        location = / {
            try_files /index.html =404;
        }

        # Dynamic REST API Endpoints -> Proxy to Gunicorn WSGI
        location /api/ {
            proxy_pass http://gunicorn_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Ssl on;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Fallback for all other routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
